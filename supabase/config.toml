# Supabase configuration for RunWear

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[functions]
[functions.generate-hero-image]
enabled = true

[functions.request-personal-generation]
enabled = true

[functions.personal-hero-worker]
enabled = true

[functions.get-personal-hero]
enabled = true

[functions.delete-my-photos]
enabled = true

[functions.start-personal-fill]
enabled = true

[functions.revenuecat-webhook]
enabled = true
# RevenueCat sends no Supabase JWT; the function authenticates the
# caller via RevenueCat's webhook authorization header instead.
verify_jwt = false

[functions.reconcile-personal-entitlement]
enabled = true
# Callers are the app's own user JWTs (self-reconciliation) and the
# service role (operator use) — both are real Supabase credentials,
# so gateway JWT verification stays ON, like start-personal-fill.

[functions.delete-my-data]
enabled = true
# The full erasure path (RW-16.30, RW-137 closure): callers are the
# app's own user JWTs; the caller's uid comes from the verified JWT.

[functions.request-identity-adoption]
enabled = true
# RW-137 P2 adoption endpoint: authenticated callers only (the
# caller's JWT is the destination identity); RC proof is re-verified
# server-side inside the function.
