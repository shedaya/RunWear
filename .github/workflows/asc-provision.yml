name: ASC Provision Widget (RunWear gen-5)

# Portal provisioning for the gen-5 iOS widget (Addendum 7):
# bundle ID, App Group, capabilities, and profiles, executed on a
# GitHub runner because this workspace's VM cannot call the ASC
# API directly. task=probe is read-only; task=apply creates the
# objects idempotently. Mirrors asc-verify.yml's key handling.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "probe (read-only inventory) or apply (create)"
        type: choice
        options:
          - probe
          - apply
        default: probe
        required: true

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the ASC API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=${{ secrets.ASC_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${{ secrets.ASC_API_ISSUER_ID }}" >> "$GITHUB_ENV"
      - name: Provision widget portal objects
        working-directory: scripts/asc
        run: python3 asc_provision_widget.py "${{ inputs.task }}"
