name: identity-screen-image

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "manual run"
        required: false
        default: "ops"
  repository_dispatch:
    types: [build-identity-screen-image]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/identity-screen-image-2026-11-03
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/identity-screen
          file: services/identity-screen/Dockerfile.provisioning
          push: true
          tags: ghcr.io/shedaya/runwear-identity-screen:v1
