name: identity-screen-image

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "manual run"
        required: false
        default: "ops"
  repository_dispatch:
    types: [build-identity-screen-image]
  push:
    branches: [ops/identity-screen-image-2026-11-03]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/identity-screen-image-2026-11-03
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Snapshot current v1 (buffalo_l F-1 build) to buffalo-v1 before any overwrite (one-off, RW-16.30 swap 2026-11-03)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/shedaya/runwear-identity-screen:buffalo-v1 \
            ghcr.io/shedaya/runwear-identity-screen@sha256:022c2fd8a6781d94608cf79279aba641ebf6ab7640c280539ab1097224766d38
      - uses: docker/build-push-action@v6
        with:
          context: services/identity-screen
          file: services/identity-screen/Dockerfile.provisioning
          push: true
          tags: ghcr.io/shedaya/runwear-identity-screen:v1
