name: ASC Packet (RunWear resubmission prep)

# Prepares (never submits) the RunWear iOS 1.0 App Store packet via
# scripts/asc/asc_packet.py. The VM cannot call the ASC API directly
# (egress stalls Authorization-header requests), so this runs on a
# GitHub runner with the same reconstructed API key as asc-verify.
# task=read prints the full packet state; task=apply attaches the
# target build and sets the prepared description + review notes,
# then prints the readback. Neither mode creates a review
# submission.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "read (print state) or apply (attach build + set texts)"
        type: choice
        options:
          - read
          - apply
        default: read
        required: true
      build:
        description: "Build number to attach in apply mode"
        required: true
        default: "16"

permissions:
  contents: read

jobs:
  asc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the ASC API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=${{ secrets.ASC_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${{ secrets.ASC_API_ISSUER_ID }}" >> "$GITHUB_ENV"
      - name: Run the packet tool
        working-directory: scripts/asc
        run: python3 asc_packet.py "${{ inputs.task }}" "${{ inputs.build }}"
