name: ASC Review Status (read-only, all apps)

# Read-only App Store Connect review-status readback for JetGuide,
# RunWear and AccliMate. This VM cannot call the ASC API directly
# (egress stalls Authorization-header requests), so the readback
# executes on a GitHub runner. Triggered by push to the ops branch
# because the automation credential cannot call the dispatch endpoint.

on:
  push:
    branches:
      - ops/asc-review-status-2026-11-03
  workflow_dispatch:

jobs:
  asc-review-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct the ASC API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=${{ secrets.ASC_API_KEY_ID }}" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=${{ secrets.ASC_API_ISSUER_ID }}" >> "$GITHUB_ENV"
      - name: Read review status for all three apps (GET only)
        working-directory: scripts/asc
        run: python3 asc_review_status.py
