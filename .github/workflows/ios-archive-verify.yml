# Branch-scoped archive verification for the privacy-manifest work
# (feat/ios-privacy-manifest-2026-10-30). NOT the shipping pipeline:
# builds the shared :engine XCFramework exactly like ios-testflight.yml,
# then produces an UNSIGNED device archive of scheme RunWear and uploads
# the .app bundle as an artifact so the bundle contents (privacy
# manifests, embedded watch app, engine framework) can be inspected
# byte-for-byte from Linux. No secrets are used and nothing is uploaded
# to App Store Connect. Drop this file when the manifest work merges;
# the shipping pipeline remains ios-testflight.yml.
name: iOS Archive Verify (privacy manifest branch)

on:
  push:
    branches:
      - "feat/ios-privacy-manifest-2026-10-30"
  workflow_dispatch:

concurrency:
  group: ios-archive-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Build RunWearEngine.xcframework (shared :engine module)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the XCFramework
        run: bash scripts/build-engine-framework.sh

      - name: Upload the XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: RunWearEngine-xcframework
          path: RunWear-iOS/Frameworks/RunWearEngine.xcframework
          if-no-files-found: error

  archive:
    name: Unsigned archive + bundle inventory
    needs: engine
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Download the XCFramework
        uses: actions/download-artifact@v4
        with:
          name: RunWearEngine-xcframework
          path: RunWear-iOS/Frameworks/RunWearEngine.xcframework

      - name: Archive the app (unsigned, Release)
        run: |
          set -euo pipefail
          xcodebuild \
            -project RunWear-iOS/RunWear.xcodeproj \
            -scheme RunWear \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RunWear.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Bundle inventory (evidence in the log)
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/RunWear.xcarchive/Products/Applications/RunWear.app"
          test -d "$APP"
          echo "== .app inventory =="
          find "$APP" | sort
          echo "== PrivacyInfo files in bundle =="
          find "$APP" -name "PrivacyInfo.xcprivacy" | sort || true

      - name: Upload the archived .app
        uses: actions/upload-artifact@v4
        with:
          name: runwear-archive-app
          path: ${{ runner.temp }}/RunWear.xcarchive/Products/Applications/RunWear.app
          if-no-files-found: error
