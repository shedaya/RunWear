# iOS build verification on a macOS runner.
#
# This exists because iOS development for this repo happens in a Linux cloud
# environment that cannot compile Swift — this workflow is the compile
# feedback loop for the native iOS app in RunWear-iOS/. It runs only on iOS
# branches and on manual dispatch to conserve macOS runner minutes (billed
# at 10x on private repos).
#
# It is NOT the shipping pipeline: signing, archiving, and TestFlight come
# later (an App Store Connect record for RunWear iOS does not exist yet).
#
# Stage 2 (2026-10-29): the app links the shared :engine KMP module as
# RunWearEngine.xcframework, so this job builds it first (same runner —
# macos-15/Xcode 16 is the toolchain Kotlin 2.0.21 supports). The
# framework directory is gitignored and never committed.
name: iOS Build

on:
  push:
    branches:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android action: v3 fails on current runner images
      # (verified 2026-10-29). GitHub macOS images ship the Android SDK
      # with licenses pre-accepted; AGP downloads any missing platform.

      - name: Build the shared engine XCFramework
        run: bash scripts/build-engine-framework.sh

      - name: Tool versions
        run: xcodebuild -version

      - name: Build iOS app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RunWear-iOS/RunWear.xcodeproj \
            -scheme RunWear \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD" || true
          if ! tail -5 xcodebuild.log | grep -q "BUILD SUCCEEDED"; then
            echo "=================== xcodebuild.log tail (diagnostics) ==================="
            tail -220 xcodebuild.log
            python3 - xcodebuild.log <<'PYEOF'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          errs, fails, lds = [], [], []
          for l in lines:
              ls = l.strip()
              if 'error:' in ls and ls not in errs:
                  errs.append(ls)
              if (("Test Case" in ls and "failed" in ls) or "XCTAssert" in ls) and ls not in fails:
                  fails.append(ls)
              if ('Undefined symbols' in ls or 'symbol(s) not found' in ls or ls.startswith('ld:') or ls.startswith('"_') or 'referenced from:' in ls) and ls not in lds:
                  lds.append(ls)
          out = (errs[:4] + lds[:4] + fails[:2])[:9] or ['xcodebuild failed with no error: lines captured']
          for l in out:
              print(f"::error::{esc(l[:900])}")
          PYEOF
            exit 1
          fi

      - name: Build watch app (simulator, unsigned)
        # The watch target is a separate product (not embedded in the iOS
        # app target), so it gets its own scheme and build step here.
        # if: always() — the watch verdict must land even when the app
        # build above failed, so one run always yields both verdicts.
        if: always()
        run: |
          set -o pipefail
          xcodebuild \
            -project RunWear-iOS/RunWear.xcodeproj \
            -scheme RunWearWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-watch.log | grep -E "error:|warning:|BUILD" || true
          if ! tail -5 xcodebuild-watch.log | grep -q "BUILD SUCCEEDED"; then
            echo "=================== xcodebuild-watch.log tail (diagnostics) ==================="
            tail -220 xcodebuild-watch.log
            python3 - xcodebuild-watch.log <<'PYEOF'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          errs, fails, lds = [], [], []
          for l in lines:
              ls = l.strip()
              if 'error:' in ls and ls not in errs:
                  errs.append(ls)
              if (("Test Case" in ls and "failed" in ls) or "XCTAssert" in ls) and ls not in fails:
                  fails.append(ls)
              if ('Undefined symbols' in ls or 'symbol(s) not found' in ls or ls.startswith('ld:') or ls.startswith('"_') or 'referenced from:' in ls) and ls not in lds:
                  lds.append(ls)
          out = (errs[:4] + lds[:4] + fails[:2])[:9] or ['xcodebuild failed with no error: lines captured']
          for l in out:
              print(f"::error::{esc(l[:900])}")
          PYEOF
            exit 1
          fi

      - name: Run engine sweep tests (iOS simulator)
        # The RunWearTests target is the Swift port of the Kotlin outfit
        # engine sweep (OutfitRulesSweepTest): 209,600 scenarios checking
        # the v4.3 invariants against the real OutfitRecommendationService.
        # It compiles the engine + models directly (no UI), so a Kotlin
        # engine change that isn't ported to Swift fails here even though
        # the app itself still builds. if: always() — the sweep verdict
        # must land even when a build step above failed.
        if: always()
        run: |
          set -o pipefail
          xcodebuild \
            -project RunWear-iOS/RunWear.xcodeproj \
            -scheme RunWear \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:RunWearTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-test.log | grep -E "error:|Test Suite|TEST" || true
          if ! grep -q "TEST SUCCEEDED" xcodebuild-test.log; then
            echo "=================== xcodebuild-test.log tail (diagnostics) ==================="
            tail -220 xcodebuild-test.log
            python3 - xcodebuild-test.log <<'PYEOF'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          def esc(s):
              return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          errs, fails, lds = [], [], []
          for l in lines:
              ls = l.strip()
              if 'error:' in ls and ls not in errs:
                  errs.append(ls)
              if (("Test Case" in ls and "failed" in ls) or "XCTAssert" in ls) and ls not in fails:
                  fails.append(ls)
              if ('Undefined symbols' in ls or 'symbol(s) not found' in ls or ls.startswith('ld:') or ls.startswith('"_') or 'referenced from:' in ls) and ls not in lds:
                  lds.append(ls)
          out = (errs[:4] + lds[:4] + fails[:2])[:9] or ['xcodebuild failed with no error: lines captured']
          for l in out:
              print(f"::error::{esc(l[:900])}")
          PYEOF
            exit 1
          fi

      - name: Upload full build logs
        # always() so the watch log is captured even when the watch step
        # ran (and possibly failed) after an app-step failure.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            xcodebuild-watch.log
            xcodebuild-test.log
          if-no-files-found: ignore
