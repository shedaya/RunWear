name: RW-169 Targeted Tests (temporary diagnostic)

# TEMPORARY (RW-169 lane, Nov 11, 2026): runs only the RW-169 /
# RW-152 / RW-140 test classes so failure messages arrive inside
# minutes instead of at the full gate's job-timeout. Deleted
# before the lane's final gate run; not part of the fix.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    name: RW-169 targeted unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run targeted tests
        working-directory: RunWear-android
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.runwear.app.weariverun.Rw169*" \
            --tests "com.runwear.app.ui.screens.Rw169*" \
            --tests "com.runwear.app.ui.screens.Rw152Morph*" \
            --tests "com.runwear.app.ui.screens.Rw140*" \
            --stacktrace

      - name: Upload targeted test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw169-targeted-results
          path: RunWear-android/app/build/test-results/
          if-no-files-found: warn

      - name: Upload targeted renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rw169-targeted-renders
          path: RunWear-android/app/build/render-out*/
          if-no-files-found: warn
